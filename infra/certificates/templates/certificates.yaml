{{- range $certName, $config := .Values.certificates }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $certName }}-issuer
spec:
  vault:
    path: pki/sign/{{ $config.vaultRole }}
    server: http://vault.vault.svc:8200
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: pki-issuer 
        secretRef:
          name: cert-manager-vault-token
          key: token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $certName }}
  namespace: {{ $config.namespace }}
spec:
  secretName: {{ $certName }}
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: {{ $certName }}-issuer  
    kind: ClusterIssuer
  commonName: {{ index $config.dnsNames 0 }}
  dnsNames:
    {{- toYaml $config.dnsNames | nindent 4 }}
{{- end }}