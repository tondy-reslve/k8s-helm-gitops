{{- range $certName, $config := .Values.certificates }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $certName }}
  namespace: {{ $config.namespace }}
spec:
  secretName: {{ $certName }}
  duration: 2160h
  renewBefore: 360h
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
  commonName: {{ $config.commonName | default (index $config.dnsNames 0) | quote }}
  dnsNames:
    {{- toYaml $config.dnsNames | nindent 4 }}
  {{- if $config.keystores }}
  keystores:
    {{- toYaml $config.keystores | nindent 4 }}
  {{- end }}

{{- if $config.keystores }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $certName }}-pass
  namespace: {{ $config.namespace }}
type: Opaque
stringData:
  password: "changeit"
{{- end }}
{{- end }}