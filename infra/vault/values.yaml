vault:
  server:
    nodeSelector:
      pool: infra
    
    ha:
      enabled: true
      replicas: 3
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }
          storage "raft" {
            path = "/vault/data"
          }

  ui:
    enabled: true
    serviceType: NodePort
    serviceNodePort: 32000

  injector:
    enabled: true
    nodeSelector:
      pool: infra
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m