apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    server: http://vault.vault.svc.cluster.local:8200
    path: pki/sign/k8s-dot-local
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: pki-issuer
        secretRef:
          name: cert-manager-vault-token
          key: token