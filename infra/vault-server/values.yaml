vault:
  global:
    tlsDisable: false

  injector:
    enabled: false

  server:
    image:
      repository: "hashicorp/vault"
      tag: "1.19.0"
    nodeSelector:
      pool: infra

    extraEnvironmentVars:
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/userconfig/vault-tls-secret/ca.crt"

    extraVolumes:
      - type: secret
        name: vault-tls-secret
      - type: secret
        name: vault-ca-secret

    readinessProbe:
      enabled: true
      path: "/v1/sys/health?standbyok=true"
      scheme: "HTTPS"
    livenessProbe:
      enabled: true
      path: "/v1/sys/health?standbyok=true"
      scheme: "HTTPS"

    dataStorage:
      enabled: true
      size: 10Gi
      storageClass: "longhorn"

    ha:
      enabled: true
      replicas: 3
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = true
          listener "tcp" {
            tls_disable = 0
            address = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file      = "/vault/userconfig/vault-tls-secret/tls.crt"
            tls_key_file       = "/vault/userconfig/vault-tls-secret/tls.key"
          }
          storage "raft" {
            path = "/vault/data"

            retry_join {
              leader_api_addr = "https://vault-server-0.vault-server-internal.vault.svc.cluster.local:8200"
              leader_ca_cert_file = "/vault/userconfig/vault-tls-secret/ca.crt"
              leader_tls_servername = "vault.infra.local"
            }
            retry_join {
              leader_api_addr = "https://vault-server-1.vault-server-internal.vault.svc.cluster.local:8200"
              leader_ca_cert_file = "/vault/userconfig/vault-tls-secret/ca.crt"
              leader_tls_servername = "vault.infra.local"
            }
            retry_join {
              leader_api_addr = "https://vault-server-2.vault-server-internal.vault.svc.cluster.local:8200"
              leader_ca_cert_file = "/vault/userconfig/vault-tls-secret/ca.crt"
              leader_tls_servername = "vault.infra.local"
            }
          }

  ui:
    enabled: true
    serviceType: NodePort
    serviceNodePort: 32000