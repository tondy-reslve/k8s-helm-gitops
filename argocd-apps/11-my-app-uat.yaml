apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-uat
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: uat-project
  source:
    repoURL: 'https://github.com/tondy-reslve/k8s-helm-gitops.git'
    targetRevision: HEAD
    path: my-app
    helm:
      valueFiles:
        - values-uat.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: uat-backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true