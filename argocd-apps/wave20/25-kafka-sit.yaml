apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-sit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "23"
spec:
  project: sit-project
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: my-app-sit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  source:
    repoURL: 'https://github.com/tondy-reslve/k8s-helm-gitops.git'
    targetRevision: HEAD
    path: charts/kafka
    helm:
      valueFiles:
        - ../../middleware/kafka/values-sit.yaml