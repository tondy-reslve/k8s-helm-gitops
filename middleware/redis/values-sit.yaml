architecture: sentinel

image:
  repository: docker.io/library/redis
  tag: "6.2.23"
  pullPolicy: IfNotPresent

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "my-app-sit-role"
  vault.hashicorp.com/tls-skip-verify: "true"
  vault.hashicorp.com/namespace: "admin"

  vault.hashicorp.com/agent-inject-secret-redis-password: "secret/data/sit/redis"
  vault.hashicorp.com/agent-inject-template-redis-password: |
    {{- with secret "secret/data/sit/redis" -}}
    {{ index .Data.data "redis-password" }}
    {{- end -}}

auth:
  enabled: true

tls:
  enabled: true
  existingSecret: "redis-crt"
  certFilename: tls.crt
  keyFilename: tls.key
  caFilename: ca.crt

replication:
  primary:
    persistence:
      storageClass: "longhorn-sit"
      size: 2Gi
  replica:
    persistence:
      storageClass: "longhorn-sit"
      size: 2Gi