mode: production

fullnameOverride: "keycloak-sit"

replicaCount: 3

cache:
  enabled: true
  stack: jdbc-ping 

hostname:
  hostname: "keycloak.my-app-sit.svc.cluster.local"
  strict: false

http:
  enabled: false

podAnnotations:
  vault.hashicorp.com/agent-inject: "true"
  vault.hashicorp.com/role: "my-app-sit-role"
  vault.hashicorp.com/tls-skip-verify: "true"
  vault.hashicorp.com/namespace: "admin"

  vault.hashicorp.com/agent-inject-secret-keycloak: "secret/data/sit/keycloak"
  vault.hashicorp.com/agent-inject-template-keycloak: |
    {{- with secret "secret/data/sit/keycloak" -}}
    export KC_BOOTSTRAP_ADMIN_USERNAME="{{ index .Data.data "admin-username" }}"
    export KC_BOOTSTRAP_ADMIN_PASSWORD="{{ index .Data.data "admin-password" }}"
    export KC_DB_USERNAME="{{ index .Data.data "db-username" }}"
    export KC_DB_PASSWORD="{{ index .Data.data "db-password" }}"
    {{- end -}}

extraEnv:
  - name: KC_HTTPS_CERTIFICATE_FILE
    value: "/tls/tls.crt"
  - name: KC_HTTPS_CERTIFICATE_KEY_FILE
    value: "/tls/tls.key"
  - name: JGROUPS_DISCOVERY_PROTOCOL
    value: "JDBC_PING"

database:
  external:
    vendor: postgres
    host: "postgresql-sit.my-app-sit.svc.cluster.local"
    port: 5432
    name: "keycloak"
    username: "keycloak"

proxy:
  headers: xforwarded

ingress:
  public:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "my-app-sit-keycloak-crt-issuer"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    hosts:
      - host: "keycloak.my-app-sit.svc.cluster.local"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - "keycloak.my-app-sit.svc.cluster.local"
        secretName: "keycloak-crt"