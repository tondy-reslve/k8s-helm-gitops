apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.env }}-{{ .Chart.Name }}-ingress
  namespace: {{ .Values.env }}-backend
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.env }}-myapp.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.env }}-{{ .Chart.Name }}-svc
            port:
              number: 80