apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.env }}-{{ .Chart.Name }}
  namespace: {{ .Values.env }}-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      env: {{ .Values.env }}
  template:
    metadata:
      {{- if .Values.podAnnotations }}
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 10 }}
      {{- end }}
      labels:
        app: {{ .Chart.Name }}
        env: {{ .Values.env }}
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 1688
        env:
        - name: DB_HOST
          value: "postgresql-sit-postgresql.my-app-sit.svc.cluster.local"
          
        - name: KAFKA_HOST
          value: "kafka-sit-kafka.my-app-sit.svc.cluster.local"
          
        - name: KEYCLOAK_HOST
          value: "keycloak-sit.my-app-sit.svc.cluster.local:8443"
          
        - name: REDIS_HOST
          value: "redis-sit-sentinel.my-app-sit.svc.cluster.local"

        volumeMounts:
          - name: ca-pem-volume
            mountPath: /etc/ssl/certs/k8s-local-ca.crt
            subPath: ca.crt
            readOnly: true
      volumes:
        - name: ca-pem-volume
          secret:
            secretName: backend-truststore