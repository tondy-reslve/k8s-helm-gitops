apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . }}-entrypoint
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  entrypoint.sh: |
    #!/bin/bash
    set -e
    
    echo "Waiting for Vault secrets to be injected..."
    while [ ! -f /vault/secrets/keycloak ]; do
      sleep 1
    done
    echo "Vault secrets found! Loading environment variables..."
    
    source /vault/secrets/keycloak

    echo "Starting Keycloak with Pod-level HTTPS..."

    exec /opt/keycloak/bin/kc.sh "$@"