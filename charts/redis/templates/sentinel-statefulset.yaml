{{- if include "redis.isSentinel" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis.sentinelStatefulSetName" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "redis.sentinelServiceName" . }}
  replicas: {{ .Values.sentinel.replicaCount }}
  selector:
    matchLabels:
      {{- include "redis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sentinel
  template:
    metadata:
      labels:
        {{- include "redis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sentinel
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "redis.podSpecCommon" . | nindent 6 }}
      containers:
        - name: sentinel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - |
              export REDIS_PASS=$(cat /vault/secrets/redis-password | tr -d '\n\r')
              PASSWORD_ARG=""
              if [ -n "$REDIS_PASS" ]; then
                PASSWORD_ARG="-a $REDIS_PASS --no-auth-warning"
              fi
              
              HOSTS="{{ include "redis.primaryPodFqdn" . }}"
              {{- $replicaCount := int .Values.replication.replicaCount }}
              {{- $domain := include "redis.headlessServiceFqdn" . }}
              {{- $replicaName := include "redis.replicaStatefulSetName" . }}
              {{- range $i := until $replicaCount }}
              HOSTS="$HOSTS {{ $replicaName }}-{{ $i }}.{{ $domain }}"
              {{- end }}
              
              ACTIVE_MASTER=""
              for host in $HOSTS; do
                echo "Checking role of $host..."
                ROLE=$(redis-cli --tls --cacert /tls/{{ .Values.tls.caFilename }} -h "$host" -p {{ .Values.service.ports.redis }} $PASSWORD_ARG info replication 2>/dev/null | grep role | cut -d: -f2 | tr -d '\r\n')
                if [ "$ROLE" = "master" ]; then
                  echo "Found active master: $host"
                  ACTIVE_MASTER="$host"
                  break
                fi
              done

              if [ -n "$ACTIVE_MASTER" ]; then
                MONITOR_HOST="$ACTIVE_MASTER"
              else
                MONITOR_HOST="$REDIS_PRIMARY_HOST"
              fi
              
              echo "Resolving IP for $MONITOR_HOST..."
              MONITOR_IP=$(getent hosts $MONITOR_HOST | awk '{ print $1 }' | head -n 1)
              if [ -z "$MONITOR_IP" ]; then
                echo "Warning: Could not resolve IP, fallback to hostname"
                MONITOR_IP=$MONITOR_HOST
              fi

              echo "Sentinel will monitor master at IP: $MONITOR_IP"

              cp /etc/redis-base/sentinel.conf /tmp/sentinel.conf
              sed -i '/sentinel monitor/d' /tmp/sentinel.conf
              
              echo "sentinel monitor {{ .Values.sentinel.masterSet }} $MONITOR_IP {{ .Values.service.ports.redis }} {{ .Values.sentinel.quorum }}" >> /tmp/sentinel.conf
              
              {{- if .Values.auth.enabled }}
              sed -i '/sentinel auth-pass/d' /tmp/sentinel.conf
              echo "sentinel auth-pass {{ .Values.sentinel.masterSet }} $REDIS_PASS" >> /tmp/sentinel.conf
              {{- end }}

              exec redis-sentinel /tmp/sentinel.conf
          ports:
            - name: sentinel
              containerPort: {{ .Values.service.ports.sentinel }}
          {{- if .Values.auth.enabled }}
          env:
            - name: REDIS_PRIMARY_HOST
              value: {{ include "redis.primaryPodFqdn" . | quote }}
            - name: REDIS_PRIMARY_PORT
              value: {{ .Values.service.ports.redis | quote }}
          {{- else }}
          env:
            - name: REDIS_PRIMARY_HOST
              value: {{ include "redis.primaryPodFqdn" . | quote }}
            - name: REDIS_PRIMARY_PORT
              value: {{ .Values.service.ports.redis | quote }}
          {{- end }}
          {{- with .Values.sentinel.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/redis-base/sentinel.conf
              subPath: sentinel.conf
            - name: tls-cert
              mountPath: /tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "redis.configMapName" . }}
        - name: tls-cert
          secret:
            secretName: {{ .Values.tls.existingSecret | default "redis-tls" }}
  {{- if .Values.sentinel.persistence.enabled }}
  volumeClaimTemplates:
    {{- include "redis.volumeClaimTemplate" (dict "root" . "persistence" .Values.sentinel.persistence) | nindent 4 }}
  {{- end }}
{{- end }}
